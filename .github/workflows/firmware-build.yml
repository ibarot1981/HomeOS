name: Firmware build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firmware-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-latest
    outputs:
      firmware_changed: ${{ steps.filter.outputs.firmware_changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect firmware-related changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- firmware platformio.ini .github/workflows; then
            echo "firmware_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "firmware_changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build firmware
    needs: changes
    if: needs.changes.outputs.firmware_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run
